<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Yurij — CrazyBoy49z">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2d20" stop-opacity=".30"/>
      <stop offset="60%" stop-color="#ff2d20" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#ff2d20" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d20"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="899" height="259" rx="17.5" fill="none" stroke="#30363d"/>

  <circle cx="760" cy="55" r="120" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="760;720;790;760" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="55;95;45;55" dur="12s" repeatCount="indefinite"/>
  </circle>

  <rect x="48" y="45" width="3" height="150" rx="1.5" fill="url(#line)"/>

  <text x="78" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="16" fill="#8b949e">
    &gt; whoami
  </text>

  <text x="78" y="133" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="40" font-weight="700" fill="#f0f6fc">
    Yurij
  </text>

  <text x="188" y="133" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="40" font-weight="700" fill="#8b949e">
    / CrazyBoy49z
  </text>

  <text x="78" y="169" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" fill="#c9d1d9">
    Laravel · PHP · JavaScript · Open Source
  </text>

  <text x="78" y="205" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="13" fill="#8b949e">
    Laravel  ·  Open Source  ·  UI Systems  ·  Embedded
  </text>

  <circle cx="812" cy="176" r="5" fill="#ff2d20">
    <animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="836" cy="176" r="5" fill="#7c3aed">
    <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="176" r="5" fill="#06b6d4">
    <animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <rect x="78" y="224" width="86" height="2" rx="1" fill="url(#line)">
    <animate attributeName="width" values="86;150;86" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>